# ============================================================
#  order.yaml — the one file that controls the map of the site
# ============================================================
#  Each key is a folder path under src/content/ ("" = homepage).
#  The homepage is laid out in three columns instead of an order:
#    thesis: one section, or a list of them (stacked bands on top)
#    fields: sections for the 2×2 grid (middle); unlisted ones join it
#    other:  one section (right box)
#    quick_access: up to four full folder paths (e.g. a course) shown in
#            the blurred "Quick Access" box under the Home title, left to right.
#            Swap the paths to change what it links to.
#  For every other folder you can set:
#    title:  display name of that section
#    glyph:  name of an SVG in src/_includes/glyphs/ (no .svg)
#    blurb:  one-line description shown on its tile + page
#    thesis_title: full thesis title, shown faintly on its homepage band
#    course: true marks the folder as a course (tile reads "Course")
#    order:  the order of tiles inside it (folder or file slugs).
#            Anything not listed appears after, alphabetically.
#            "makebreak" starts a new row.
#
#  Moving "differential-forms" above "vector-fields" is literally
#  swapping two lines below. Folders you haven't configured still
#  work — they get a prettified name and alphabetical order.
# ------------------------------------------------------------

"":
  title: Home
  thesis:
    - bachelors-thesis
    - masters-thesis
  fields:
    - mathematics
    - computer-science
    - bioinformatics
    - physics
  other: other
  quick_access:
    - bioinformatics/coursework/statistical-genomics
    - bioinformatics/coursework/applied-high-throughput-analysis
    - computer-science/coursework/parallel-and-distributed-software-systems
    - computer-science/coursework/visual-computing

