# ============================================================
#  courses.yaml — single source for the Course List page and its CSV
# ============================================================
#  programs → terms → courses. One course per line:
#    title:      English title (shown, linked when `notes` page exists)
#    sk:         original Slovak title (optional)
#    code:       official course code (optional)
#    ects:       credits
#    type:       A required · B required elective · C elective (optional)
#    recognised: true for a 0-ECTS recognised credit (optional)
#    notes:      folder of my notes under src/content (optional); the link
#                points at <notes>/about, and stays plain text until that
#                page is no longer a draft
#  A term may carry `status:` (e.g. "in progress", "planned").
#  A program may carry `note:` (markdown, shown under its tables).
#  Pages: src/content/other/course-list.md  ·  CSV: /other/course-list.csv
# ------------------------------------------------------------

